name: weft

services:
  postgres:
    image: postgres:16-alpine
    container_name: weft-postgres
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: weft
      POSTGRES_DB: weft
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft -d weft"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - weft-postgres-data:/var/lib/postgresql/data
  # MinIO-compatible S3 server. pgsty/silo is a drop-in MinIO fork: the upstream minio/minio images are no longer published.
  # The data directory is pre-seeded with the bucket so no separate init container is needed.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: weft-minio
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/weft-assets && exec /usr/bin/docker-entrypoint.sh server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: weft
      MINIO_ROOT_PASSWORD: weft-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - weft-minio-data:/data
volumes:
  weft-postgres-data:
  weft-minio-data:
