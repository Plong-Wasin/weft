services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weft}
      POSTGRES_USER: ${POSTGRES_USER:-weft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-weft}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-weft}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-weft}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-weft}
      WEFT_LISTEN: ${WEFT_LISTEN:-0.0.0.0:8080}
      WEFT_WEB_ROOT: /app/web
    ports:
      - "8080:8080"
    volumes:
      - attachments:/var/lib/weft/attachments
      - vault_repositories:/var/lib/weft/vaults
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  attachments:
  vault_repositories:
