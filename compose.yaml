name: weft

# `docker compose up -d` starts the whole product. `docker compose up -d postgres` starts only the development database.
# Settings come from .env (see .env.example). The api, worker and migrate services run with NODE_ENV=production and refuse to start
# while BETTER_AUTH_SECRET, POSTGRES_PASSWORD or S3_SECRET_KEY is unset or a default/placeholder value.

x-app-env: &app-env
  DATABASE_URL: postgres://weft:${POSTGRES_PASSWORD:-weft}@postgres:5432/weft
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-secret-change-before-deploy-32-chars}
  BETTER_AUTH_URL: ${API_PUBLIC_URL:-http://localhost:3000}
  # Empty keeps the sign-in origin at BETTER_AUTH_URL; set it to the public single origin to serve OAuth and /mcp there.
  WEFT_PUBLIC_URL: ${WEFT_PUBLIC_URL:-}
  # Reverse proxies in front of the API that write x-forwarded-for; 0 (direct) makes all anonymous OAuth client registrations share one rate-limit bucket.
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
  ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
  ALLOW_WORKSPACE_CREATION: ${ALLOW_WORKSPACE_CREATION:-true}
  MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-10}
  PASSWORD_BREACH_CHECK: ${PASSWORD_BREACH_CHECK:-on}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  MICROSOFT_ALLOWED_EMAIL_DOMAINS: ${MICROSOFT_ALLOWED_EMAIL_DOMAINS:-}
  PASSWORD_SIGN_IN_ENABLED: ${PASSWORD_SIGN_IN_ENABLED:-true}
  DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-}
  WEFT_INTEGRATIONS_ENABLED: ${WEFT_INTEGRATIONS_ENABLED:-false}
  # Email is on only when SMTP_HOST and SMTP_FROM are set (see .env.example). Blank keeps every email feature off.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  EMAIL_DIGEST_MINUTES: ${EMAIL_DIGEST_MINUTES:-5}
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  AI_MODEL: ${AI_MODEL:-gpt-6-luna}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-5242880}
  AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-20}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-weft-assets}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-weft}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-weft-secret}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER:-weft-postgres}
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weft}
      POSTGRES_DB: weft
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft -d weft"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - weft-postgres-data:/var/lib/postgresql/data
  # MinIO-compatible S3 server. pgsty/silo is a drop-in MinIO fork: the upstream minio/minio images are no longer published.
  # The data directory is pre-seeded with the bucket so no separate init container is needed.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: ${MINIO_CONTAINER:-weft-minio}
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/${S3_BUCKET:-weft-assets} && exec /usr/bin/docker-entrypoint.sh server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-weft}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-weft-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - weft-minio-data:/data
  # One-shot: applies database migrations, then exits. api and worker wait for it.
  migrate:
    build: { context: ., target: server }
    command: ["bun", "run", "db:migrate"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ., target: server }
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${API_PORT:-3000}:3000"
    # Readiness: database and file store answer. See docs/production.md.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
  live:
    build: { context: ., target: server }
    command: ["bun", "apps/live/src/index.ts"]
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${LIVE_PORT:-3002}:3001"
    depends_on:
      migrate: { condition: service_completed_successfully }
  mcp:
    build: { context: ., target: server }
    command: ["bun", "apps/mcp/src/http.ts"]
    restart: unless-stopped
    environment:
      WEFT_API_URL: http://api:3000
      WEFT_PUBLIC_URL: ${WEFT_PUBLIC_URL:-http://localhost:8080}
      PORT: 3001
    ports:
      - "${MCP_PORT:-3001}:3001"
    depends_on:
      migrate: { condition: service_completed_successfully }
      api: { condition: service_started }
  worker:
    build: { context: ., target: server }
    command: ["bun", "apps/worker/src/index.ts"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:3000}
        VITE_LIVE_URL: ${LIVE_PUBLIC_URL:-ws://localhost:3002}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
      - live
volumes:
  weft-postgres-data:
  weft-minio-data:
