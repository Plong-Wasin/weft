name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weft
          POSTGRES_PASSWORD: weft
          POSTGRES_DB: weft
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U weft -d weft"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:isolated --workers=2
        env:
          DATABASE_URL: postgres://weft:weft@localhost:54329/weft

  checks:
    name: checks
    if: ${{ always() }}
    needs: [typecheck, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require typecheck and tests to pass
        if: ${{ always() }}
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          printf 'typecheck: %s\ntests: %s\n' "$TYPECHECK_RESULT" "$TESTS_RESULT"
          if [[ "$TYPECHECK_RESULT" != success || "$TESTS_RESULT" != success ]]; then
            exit 1
          fi
