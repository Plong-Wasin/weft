# Opt-in single-origin deployment. Needs Docker Compose 2.24.4 or newer (`!reset`/`!override`). Both WEFT_PUBLIC_URL and SITE_ADDRESS are required. Start with:
# docker compose -f compose.yaml -f compose.proxy.yaml up --build
# Set WEFT_PUBLIC_URL to the public root origin and SITE_ADDRESS to its hostname. Caddy provisions HTTPS automatically for public domains.
# Only root-domain hosting is supported; path prefixes such as /weft are not. Serve the public site on the default ports 80 and 443
# (CADDY_HTTP_PORT/CADDY_HTTPS_PORT exist for tests): a custom port breaks the HTTPS redirect, ACME and presigned URLs.
services:
  # Only Caddy is published; direct ports would let a caller spoof x-forwarded-for and bypass the proxy.
  api:
    ports: !reset []
    environment:
      BETTER_AUTH_URL: ${WEFT_PUBLIC_URL:?set WEFT_PUBLIC_URL to the public root URL}
      WEB_ORIGIN: ${WEFT_PUBLIC_URL:?set WEFT_PUBLIC_URL to the public root URL}
      S3_PUBLIC_ENDPOINT: ${WEFT_PUBLIC_URL:?set WEFT_PUBLIC_URL to the public root URL}
      # Caddy is one hop in front of the API and writes x-forwarded-for; 0 would put every anonymous client in one rate-limit bucket.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  live:
    ports: !reset []
  mcp:
    ports: !reset []
    environment:
      WEFT_PUBLIC_URL: ${WEFT_PUBLIC_URL:?set WEFT_PUBLIC_URL to the public root URL}
  web:
    ports: !reset []
    build:
      args:
        VITE_API_URL: ""
        VITE_LIVE_URL: ""
        VITE_ASSET_PATH: ${S3_BUCKET:-weft-assets}
  minio:
    ports: !override
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the public hostname}
      S3_BUCKET: ${S3_BUCKET:-weft-assets}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - weft-caddy-data:/data
      - weft-caddy-config:/config
    depends_on:
      - api
      - mcp
      - live
      - web
      - minio

volumes:
  weft-caddy-data:
  weft-caddy-config:
